name: Actualizar fuentes (mensual)
on:
  schedule:
    - cron: '0 6 1 * *' # día 1 de cada mes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-fonts.mjs
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/fonts.json index.html
          git diff --staged --quiet || (git commit -m "Actualizar fuentes según Google Fonts" && git push)
